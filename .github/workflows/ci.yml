name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - agent/candidate-records

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: TypeScript
        run: pnpm run typecheck

      - name: Cloudflare Access tests
        run: pnpm run test:access

      - name: Enrollment validation tests
        run: pnpm run test:enrollment-validation

      - name: Student academic update tests
        run: pnpm run test:student-academic-update

      - name: Student list query tests
        run: pnpm run test:student-list-query

      - name: Production build
        run: pnpm run build

      - name: Rendered HTML tests
        run: node --test tests/rendered-html.test.mjs

      - name: Verify Cloudflare build output
        run: test -f dist/server/wrangler.json

      - name: Validate staging Cloudflare package
        env:
          CONFIRM_STAGING_DEPLOY: HOMOLOGACAO
          STAGING_DRY_RUN: "1"
          STAGING_SKIP_BUILD: "1"
          STAGING_WORKER_NAME: centep-homolog-ci
          STAGING_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
          STAGING_D1_DATABASE_NAME: centep-homolog-ci-db
          CF_ACCESS_TEAM_DOMAIN: https://centep-homolog-ci.cloudflareaccess.com
          CF_ACCESS_AUD: ci-placeholder-audience
        run: pnpm run deploy:staging

      - name: Validate D1 migrations
        run: pnpm run test:d1-migrations
